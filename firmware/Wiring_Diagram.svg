<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" font-family="Arial, Helvetica, sans-serif">
  <title>Wiring diagram: single PZEM-004T and single relay, water heater or fan</title>
  <rect x="0" y="0" width="1100" height="840" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#111">Wiring diagram: single PZEM + single relay (Ilyasa PSM2)</text>
  <text x="40" y="62" font-size="13" fill="#555">Water heater (1500W) and fan (70W) share the same socket box, plugged in one at a time</text>

  <!-- MAINS BOX -->
  <rect x="190" y="90" width="600" height="290" fill="#fff8f7" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="205" y="112" font-size="13" font-weight="bold" fill="#c0392b">MAINS BOX (bought ABS enclosure) - 240V inside, switch OFF before opening</text>

  <!-- Plug -->
  <rect x="40" y="130" width="120" height="160" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">13A 3-pin plug</text>
  <text x="100" y="205" font-size="12" text-anchor="middle" fill="#333">10A fuse fitted</text>
  <text x="100" y="240" font-size="11" text-anchor="middle" fill="#555">to RCCB-protected</text>
  <text x="100" y="256" font-size="11" text-anchor="middle" fill="#555">wall socket</text>

  <!-- Glands -->
  <rect x="184" y="145" width="12" height="135" fill="#999"/>
  <rect x="784" y="145" width="12" height="135" fill="#999"/>

  <!-- Mains wires -->
  <line x1="160" y1="160" x2="520" y2="160" stroke="#8B4513" stroke-width="3"/>
  <line x1="680" y1="160" x2="830" y2="160" stroke="#8B4513" stroke-width="3"/>
  <line x1="160" y1="230" x2="830" y2="230" stroke="#1f5fbf" stroke-width="3"/>
  <line x1="160" y1="265" x2="830" y2="265" stroke="#2e8b57" stroke-width="3" stroke-dasharray="10 4"/>
  <text x="166" y="153" font-size="11" fill="#8B4513">L</text>
  <text x="166" y="223" font-size="11" fill="#1f5fbf">N</text>
  <text x="166" y="258" font-size="11" fill="#2e8b57">E</text>

  <!-- CT coil -->
  <circle cx="250" cy="160" r="14" fill="none" stroke="#e67e22" stroke-width="3"/>
  <text x="250" y="137" font-size="11" text-anchor="middle" fill="#e67e22">CT coil</text>
  <path d="M243 174 L243 330 L270 330" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <path d="M257 174 L257 342 L270 342" fill="none" stroke="#e67e22" stroke-width="1.5"/>

  <!-- PZEM voltage taps -->
  <circle cx="330" cy="160" r="4" fill="#8B4513"/>
  <line x1="330" y1="160" x2="330" y2="295" stroke="#8B4513" stroke-width="2"/>
  <circle cx="360" cy="230" r="4" fill="#1f5fbf"/>
  <line x1="360" y1="230" x2="360" y2="295" stroke="#1f5fbf" stroke-width="2"/>

  <!-- PZEM -->
  <rect x="270" y="295" width="200" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="316" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">PZEM-004T v3.0</text>
  <text x="278" y="340" font-size="11" fill="#333">CT</text>
  <text x="345" y="340" font-size="11" fill="#333">L  N (voltage)</text>
  <text x="278" y="359" font-size="11" fill="#333">TTL: 5V  RX  TX  GND</text>

  <!-- Relay -->
  <rect x="520" y="120" width="160" height="95" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="600" y="138" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Relay module 5V</text>
  <circle cx="545" cy="160" r="4" fill="#8B4513"/>
  <circle cx="655" cy="160" r="4" fill="#8B4513"/>
  <line x1="520" y1="160" x2="545" y2="160" stroke="#8B4513" stroke-width="3"/>
  <line x1="545" y1="160" x2="648" y2="146" stroke="#333" stroke-width="2"/>
  <line x1="655" y1="160" x2="680" y2="160" stroke="#8B4513" stroke-width="3"/>
  <text x="540" y="180" font-size="10" fill="#333">COM</text>
  <text x="648" y="180" font-size="10" fill="#333">NO</text>
  <text x="600" y="206" font-size="10" text-anchor="middle" fill="#333">control: IN  VCC  GND</text>

  <!-- Low-voltage lines inside mains box to gland -->
  <path d="M600 215 L600 372 L495 372" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M440 367 L440 372 L465 372" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="465" y="372" width="30" height="14" fill="#999"/>

  <!-- Socket outlet -->
  <rect x="830" y="130" width="150" height="160" rx="6" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <text x="905" y="175" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Socket outlet</text>
  <text x="905" y="200" font-size="11" text-anchor="middle" fill="#333">plug in ONE of:</text>
  <text x="905" y="222" font-size="11" text-anchor="middle" fill="#333">water heater 1500W</text>
  <text x="905" y="240" font-size="11" text-anchor="middle" fill="#333">or fan 70W</text>
  <text x="905" y="262" font-size="11" text-anchor="middle" fill="#333">(lamp for first test)</text>

  <!-- Cable between boxes -->
  <line x1="480" y1="386" x2="480" y2="520" stroke="#666" stroke-width="6"/>
  <text x="492" y="430" font-size="11" fill="#444">8-core low-voltage cable (about 1 m):</text>
  <text x="492" y="446" font-size="11" fill="#444">relay IN, VCC, GND</text>
  <text x="492" y="462" font-size="11" fill="#444">PZEM 5V, RX, TX, GND</text>

  <!-- CONTROLLER BOX -->
  <rect x="190" y="490" width="600" height="290" fill="#f5f9fe" stroke="#185fa5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="205" y="510" font-size="13" font-weight="bold" fill="#185fa5">CONTROLLER BOX (3D printed) - low voltage only (5V / 3.3V)</text>

  <!-- ESP32 -->
  <rect x="380" y="520" width="260" height="235" rx="4" fill="#eaf2fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="510" y="542" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">ESP32 DevKit</text>
  <text x="392" y="566" font-size="11.5" fill="#222">GPIO 26 -&gt; relay IN</text>
  <text x="392" y="586" font-size="11.5" fill="#222">GPIO 27 -&gt; buzzer +</text>
  <text x="392" y="606" font-size="11.5" fill="#222">GPIO 16 (RX2) &lt;- PZEM TX</text>
  <text x="392" y="626" font-size="11.5" fill="#222">GPIO 17 (TX2) -&gt; PZEM RX</text>
  <text x="392" y="646" font-size="11.5" fill="#222">GPIO 21 (SDA) -&gt; LCD SDA</text>
  <text x="392" y="666" font-size="11.5" fill="#222">GPIO 22 (SCL) -&gt; LCD SCL</text>
  <text x="392" y="686" font-size="11.5" fill="#777">GPIO 4 -&gt; DHT22 data (optional)</text>
  <text x="392" y="712" font-size="11.5" fill="#222">5V / VIN -&gt; relay VCC, PZEM 5V, LCD VCC</text>
  <text x="392" y="732" font-size="11.5" fill="#222">GND -&gt; every GND (common ground)</text>

  <!-- LCD -->
  <rect x="210" y="530" width="140" height="62" rx="4" fill="#eaf2fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="280" y="554" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">LCD 16x2 + I2C</text>
  <text x="280" y="574" font-size="10.5" text-anchor="middle" fill="#333">VCC GND SDA SCL</text>
  <line x1="350" y1="561" x2="380" y2="561" stroke="#185fa5" stroke-width="2"/>

  <!-- Buzzer -->
  <rect x="210" y="610" width="140" height="58" rx="4" fill="#eaf2fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="280" y="634" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Active buzzer</text>
  <text x="280" y="653" font-size="10.5" text-anchor="middle" fill="#333">+ GPIO 27, - GND</text>
  <line x1="350" y1="639" x2="380" y2="639" stroke="#185fa5" stroke-width="2"/>

  <!-- DHT22 optional -->
  <rect x="210" y="688" width="140" height="58" rx="4" fill="#ffffff" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="712" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">DHT22 (optional)</text>
  <text x="280" y="731" font-size="10.5" text-anchor="middle" fill="#555">data GPIO 4, 3.3V, GND</text>
  <line x1="350" y1="717" x2="380" y2="717" stroke="#185fa5" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- USB supply -->
  <rect x="660" y="560" width="115" height="66" rx="4" fill="#ffffff" stroke="#185fa5" stroke-width="1.5"/>
  <text x="717" y="587" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">5V USB supply</text>
  <text x="717" y="606" font-size="10.5" text-anchor="middle" fill="#333">phone charger</text>
  <line x1="640" y1="593" x2="660" y2="593" stroke="#185fa5" stroke-width="2"/>

  <!-- WiFi / Blynk -->
  <rect x="660" y="650" width="115" height="66" rx="4" fill="#ffffff" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="717" y="676" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">WiFi to Blynk</text>
  <text x="717" y="695" font-size="10.5" text-anchor="middle" fill="#333">laptop runs LSTM</text>
  <line x1="640" y1="683" x2="660" y2="683" stroke="#185fa5" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Notes -->
  <rect x="830" y="320" width="250" height="400" rx="6" fill="#fffdf5" stroke="#b8860b" stroke-width="1.5"/>
  <text x="845" y="345" font-size="13" font-weight="bold" fill="#8a6100">Safety and build notes</text>
  <text font-size="11" fill="#333">
    <tspan x="845" y="372">1. Only the LIVE wire (brown) goes</tspan>
    <tspan x="845" y="387">through the relay. N and E pass</tspan>
    <tspan x="845" y="402">straight through.</tspan>
    <tspan x="845" y="426">2. 10A fuse in the plug. The heater</tspan>
    <tspan x="845" y="441">draws about 6.25A at 240V, so a 3A</tspan>
    <tspan x="845" y="456">or 5A fuse will blow.</tspan>
    <tspan x="845" y="480">3. Unplug, then check with the tester</tspan>
    <tspan x="845" y="495">pen before opening the mains box.</tspan>
    <tspan x="845" y="519">4. Heat-shrink every splice.</tspan>
    <tspan x="845" y="534">No bare copper anywhere.</tspan>
    <tspan x="845" y="558">5. Test order: lamp, then fan,</tspan>
    <tspan x="845" y="573">then water heater.</tspan>
    <tspan x="845" y="597">6. Only low voltage leaves the mains</tspan>
    <tspan x="845" y="612">box, through the 8-core cable.</tspan>
    <tspan x="845" y="636">7. Confirm pins 16/17 (PZEM) and</tspan>
    <tspan x="845" y="651">21/22 (LCD) against Ilyasa's PSM1</tspan>
    <tspan x="845" y="666">sketch before wiring. These are the</tspan>
    <tspan x="845" y="681">standard defaults, not verified.</tspan>
    <tspan x="845" y="705">8. Relay: 30A module preferred.</tspan>
  </text>

  <!-- Legend -->
  <line x1="40" y1="810" x2="70" y2="810" stroke="#8B4513" stroke-width="3"/>
  <text x="78" y="814" font-size="11" fill="#333">Live (L)</text>
  <line x1="150" y1="810" x2="180" y2="810" stroke="#1f5fbf" stroke-width="3"/>
  <text x="188" y="814" font-size="11" fill="#333">Neutral (N)</text>
  <line x1="275" y1="810" x2="305" y2="810" stroke="#2e8b57" stroke-width="3" stroke-dasharray="10 4"/>
  <text x="313" y="814" font-size="11" fill="#333">Earth (E)</text>
  <line x1="390" y1="810" x2="420" y2="810" stroke="#e67e22" stroke-width="3"/>
  <text x="428" y="814" font-size="11" fill="#333">CT coil leads</text>
  <line x1="530" y1="810" x2="560" y2="810" stroke="#666" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="568" y="814" font-size="11" fill="#333">Low-voltage signal</text>
  <circle cx="700" cy="810" r="4" fill="#333"/>
  <text x="710" y="814" font-size="11" fill="#333">Dot = joined. Lines crossing without a dot are NOT joined.</text>
</svg>
